name: HiringCafe Job Notifier

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium

      - name: Create config.json
        run: |
          cat > config.json << 'EOF'
          {
            "telegram_bot_token": "${{ secrets.TELEGRAM_BOT_TOKEN }}",
            "telegram_chat_ids": ${{ secrets.TELEGRAM_CHAT_IDS }},
            "hiringcafe_url": "${{ secrets.HIRINGCAFE_URL }}",
            "scrape_interval_minutes": 7,
            "max_compensation_lakhs": 15
          }
          EOF

      - name: Restore job database
        uses: actions/cache@v4
        with:
          path: jobs.db
          key: jobs-db-cache

      - name: Run notifier
        run: python notifier.py once
        env:
          PYTHONUNBUFFERED: 1
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PREFERENCES_MD: ${{ secrets.PREFERENCES_MD }}

      - name: Schedule next run (10 min)
        if: always()
        shell: bash
        run: |
          echo "⏰ Waiting 10 minutes before next run..."
          sleep 600
          echo "✅ Done waiting, triggering next run..."

      - name: Trigger next run
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'notify.yml',
              ref: 'main'
            });
            console.log('🚀 Next run dispatched!');

      - name: Save database
        uses: actions/cache/save@v4
        with:
          path: jobs.db
          key: jobs-db-cache
